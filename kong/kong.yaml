plugins:
- config:
    access:
    - |
      -- Apigee path rewrite (apigee-kong-migrator)
      local route        = kong.router.get_route()
      local service      = kong.router.get_service()
      local service_path = (service and service.path) or "/"
      -- Check for apigee-strip-len tag set on suffix routes during migration
      local strip_len = nil
      if route and route.tags then
        for _, tag in ipairs(route.tags) do
          if tag:sub(1, 17) == "apigee-strip-len:" then
            strip_len = tonumber(tag:sub(18))
            break
          end
        end
      end
      -- Fall back to route path length if no tag (covers normal routes)
      if not strip_len then
        local route_path = (route and route.paths and route.paths[1]) or "/"
        if route_path:sub(1, 1) == "~" then route_path = route_path:sub(2) end
        strip_len = #route_path
      end
      local incoming = kong.request.get_path()
      local suffix = "/"
      if #incoming >= strip_len then
        suffix = incoming:sub(strip_len + 1)
      end
      if suffix == "" then suffix = "/" end
      local clean_target = service_path:gsub("/+$", "")
      if suffix:sub(1, 1) ~= "/" then suffix = "/" .. suffix end
      kong.service.request.set_path(clean_target .. suffix)
